name: Vet Compliance

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Vet check
        run: node vet/check.mjs --format github
