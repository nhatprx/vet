name: Ponytail Compliance

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ponytail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Ponytail check
        run: node ponytail/check.mjs
